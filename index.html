<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Basketball Game Timer</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/digital-7-mono');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* ヘッダーエリア */
  .header {
    height: 34px;
    flex-shrink: 0;
    background-color: #0d0d0d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    border-bottom: 2px solid #1f1f1f;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .title {
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #555;
  }
  .audio-badge {
    font-size: 0.68rem;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
    background-color: #2a1a00;
    color: #ffab00;
    border: 1px solid #553800;
  }
  .audio-badge.active {
    background-color: #002e14;
    color: #00e676;
    border-color: #00602a;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .status-badge {
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    background-color: #222;
    color: #777;
  }
  .header .status-badge.running {
    background-color: #00e676;
    color: #000;
  }
  .header .status-badge.paused {
    background-color: #ff9100;
    color: #000;
  }
  .header .status-badge.ended {
    background-color: #ff1744;
    color: #fff;
    animation: flash 0.5s infinite alternate;
  }

  .btn-fs {
    background-color: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
  }

  @keyframes flash {
    from { opacity: 1; }
    to { opacity: 0.25; }
  }

  /* メインタイマー表示エリア */
  .timer-box {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: radial-gradient(circle, #151515 0%, #000000 100%);
    position: relative;
    border: 4px solid transparent;
    overflow: hidden;
  }
  .timer-box.ended {
    border-color: #ff1744;
    background: #250005;
  }
  
  .mode-label {
    position: absolute;
    top: 6px;
    left: 12px;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 2px 10px;
    border-radius: 6px;
    background-color: #141414;
    color: #ffd600;
    border: 1px solid #282828;
    z-index: 10;
  }
  .mode-label.rest {
    color: #76ff03;
    border-color: #43a047;
  }

  /* 特大 Digital-7 タイマー表示レイヤー */
  .digits-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  /* 消灯セグメント（背景ガイド 88:88 / 88.8） */
  .digits-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Digital-7 Mono', 'Digital-7', monospace;
    font-size: min(35vw, 62vh);
    color: rgba(255, 214, 0, 0.05);
    line-height: 0.82;
    transform: scaleY(1.35);
    transform-origin: center center;
    pointer-events: none;
    white-space: nowrap;
  }
  .digits-bg.rest {
    color: rgba(118, 255, 3, 0.06);
  }

  /* 点灯セグメント */
  .digits-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Digital-7 Mono', 'Digital-7', monospace;
    font-size: min(35vw, 62vh);
    font-weight: bold;
    color: #ffd600;
    text-shadow: 0 0 35px rgba(255, 214, 0, 0.6), 0 0 70px rgba(255, 214, 0, 0.3);
    line-height: 0.82;
    transform: scaleY(1.35);
    transform-origin: center center;
    white-space: nowrap;
    z-index: 2;
  }
  /* 休憩モード: 鮮やかなライムグリーン（最後まで維持） */
  .digits-container.rest {
    color: #76ff03 !important;
    text-shadow: 0 0 35px rgba(118, 255, 3, 0.7), 0 0 70px rgba(118, 255, 3, 0.35) !important;
  }
  /* GAMEモードの1分未満: オレンジレッド */
  .digits-container.sub-second {
    color: #ff3d00;
    text-shadow: 0 0 35px rgba(255, 61, 0, 0.7), 0 0 70px rgba(255, 61, 0, 0.35);
  }

  .slot-num {
    display: inline-block;
    width: 0.56em;
    text-align: center;
  }
  .slot-sep {
    display: inline-block;
    width: 0.30em;
    text-align: center;
  }

  .tap-hint {
    position: absolute;
    bottom: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    color: #383838;
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 10;
  }

  /* コントロールパネル */
  .controls {
    height: 68px;
    flex-shrink: 0;
    background-color: #0a0a0a;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    padding: 6px 6px;
    border-top: 2px solid #1a1a1a;
  }
  .btn {
    background-color: #1e1e1e;
    color: #f0f0f0;
    border: none;
    border-radius: 8px;
    font-size: clamp(0.7rem, 1.4vw, 1rem);
    font-weight: 800;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
  }
  .btn:active {
    transform: scale(0.96);
    background-color: #333;
  }
  .btn-mode {
    border: 2px solid transparent;
  }
  .btn-game {
    background-color: #b71c1c;
    color: #fff;
  }
  .btn-game.active {
    border-color: #ffd600;
    box-shadow: 0 0 10px rgba(255, 214, 0, 0.4);
  }
  .btn-rest {
    background-color: #1b5e20;
    color: #fff;
  }
  .btn-rest.active {
    border-color: #76ff03;
    box-shadow: 0 0 10px rgba(118, 255, 3, 0.4);
  }
  .btn-action {
    background-color: #0d47a1;
    color: #fff;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="title">BASKETBALL TIMER</div>
      <div id="audioBadge" class="audio-badge">AUDIO: 待機</div>
    </div>
    <div class="header-right">
      <button class="btn-fs" onclick="toggleFullScreen()" id="fsBtn">⛶ 全画面</button>
      <div id="statusBadge" class="status-badge">READY</div>
    </div>
  </div>

  <div class="timer-box" id="timerBox" onclick="toggleTimer()">
    <div class="mode-label" id="modeLabel">GAME (5:00)</div>
    <div class="digits-wrapper">
      <div class="digits-bg" id="displayBg">
        <span class="slot-num">8</span>
        <span class="slot-num">8</span>
        <span class="slot-sep">:</span>
        <span class="slot-num">8</span>
        <span class="slot-num">8</span>
      </div>
      <div class="digits-container" id="display">
        <span class="slot-num" style="visibility: hidden;">0</span>
        <span class="slot-num">5</span>
        <span class="slot-sep">:</span>
        <span class="slot-num">0</span>
        <span class="slot-num">0</span>
      </div>
    </div>
    <div class="tap-hint" id="tapHint">画面タップで START / STOP</div>
  </div>

  <div class="controls">
    <button class="btn btn-mode btn-game active" id="btnGame5" onclick="setMode('game', 5 * 60 * 1000, 'btnGame5', 'GAME (5:00)')">5分</button>
    <button class="btn btn-mode btn-game" id="btnGame6" onclick="setMode('game', 6 * 60 * 1000, 'btnGame6', 'GAME (6:00)')">6分</button>
    <button class="btn btn-mode btn-game" id="btnGame7" onclick="setMode('game', 7 * 60 * 1000, 'btnGame7', 'GAME (7:00)')">7分</button>
    <button class="btn btn-mode btn-game" id="btnGame8" onclick="setMode('game', 8 * 60 * 1000, 'btnGame8', 'GAME (8:00)')">8分</button>
    <button class="btn btn-mode btn-rest" id="btnRest" onclick="setMode('rest', 75 * 1000, 'btnRest', '休憩 (1:15)')">休憩</button>
    <button class="btn" onclick="adjustTime(60000)">+1 分</button>
    <button class="btn" onclick="adjustTime(-60000)">-1 分</button>
    <button class="btn" onclick="adjustTime(10000)">+10 秒</button>
    <button class="btn" onclick="adjustTime(-10000)">-10 秒</button>
    <button class="btn btn-action" onclick="testBuzzer()">📢 試聴</button>
  </div>

<script>
  let currentMode = 'game';
  let currentBtnId = 'btnGame5';
  let currentLabelText = 'GAME (5:00)';
  let defaultDuration = 5 * 60 * 1000;
  let remainingMs = defaultDuration;
  let targetEndTime = null;
  let isRunning = false;
  let timerIntervalId = null;
  let lastCountdownSec = -1;
  let hasTriggeredOneMinAlert = false;
  let hasTriggeredRest15sAlert = false;
  let wakeLock = null;

  // Web Audio API 関連
  let audioCtx = null;
  let masterOut = null;
  let keepAliveOsc = null;

  // SpeechSynthesis 安定化関連
  let selectedVoice = null;
  let activeUtterances = []; // GC（途中切断）防止用
  let speakDelayTimer = null;

  const displayEl = document.getElementById('display');
  const displayBgEl = document.getElementById('displayBg');
  const timerBoxEl = document.getElementById('timerBox');
  const statusBadgeEl = document.getElementById('statusBadge');
  const audioBadgeEl = document.getElementById('audioBadge');
  const tapHintEl = document.getElementById('tapHint');
  const modeLabelEl = document.getElementById('modeLabel');
  const fsBtnEl = document.getElementById('fsBtn');

  // ====== ローカル音声の優先選択（Windows/Edgeのオンライン音声による途切れ・無音を回避） ======
  function selectBestVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return;

    // 1. 端末内ローカルの英語音声（通信不要で最も途切れにくい）
    let voice = voices.find(v => v.localService && /^en[-_](US|GB)/i.test(v.lang));
    if (!voice) voice = voices.find(v => v.localService && /^en/i.test(v.lang));
    // 2. オンライン時のみクラウド英語音声を許可（オフライン時はローカル日本語等に逃がす）
    if (!voice && navigator.onLine) {
      voice = voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    }
    // 3. 英語ローカルが無いオフライン環境ではローカル音声を使用
    if (!voice) voice = voices.find(v => v.localService);
    selectedVoice = voice || voices[0] || null;
  }

  if ('speechSynthesis' in window) {
    selectBestVoice();
    window.speechSynthesis.onvoiceschanged = selectBestVoice;
  }

  // ====== Web Audio API 初期化・コンプレッサー・Bluetoothスリープ防止 ======
  function updateAudioBadge() {
    if (audioCtx && audioCtx.state === 'running') {
      audioBadgeEl.textContent = 'AUDIO: ON';
      audioBadgeEl.classList.add('active');
    } else {
      audioBadgeEl.textContent = 'AUDIO: 待機';
      audioBadgeEl.classList.remove('active');
    }
  }

  function startBluetoothKeepAlive() {
    if (!audioCtx || keepAliveOsc) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      // Bluetooth SBC/AACを通過しやすく、耳にはほぼ聞こえない100Hz・極小ゲイン
      osc.type = 'sine';
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.0015, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      keepAliveOsc = osc;
    } catch (e) {
      console.error('Keep-Alive start error:', e);
    }
  }

  async function ensureAudioRunning() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      // 音割れ・Bluetooth保護回路によるミュートを防ぐマスターリミッター
      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-10, audioCtx.currentTime);
      compressor.knee.setValueAtTime(6, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.15, audioCtx.currentTime);

      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.95, audioCtx.currentTime);

      compressor.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      masterOut = compressor;

      audioCtx.onstatechange = updateAudioBadge;
    }

    if (audioCtx.state === 'suspended') {
      try {
        await audioCtx.resume();
      } catch (e) {
        console.error('AudioContext resume error:', e);
      }
    }

    startBluetoothKeepAlive();
    updateAudioBadge();

    if ('speechSynthesis' in window && window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  }

  // ==== スリープ防止 (Screen Wake Lock API) ====
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock was released');
        });
      }
    } catch (err) {
      console.error(`${err.name}, ${err.message}`);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => {
        wakeLock = null;
      }).catch(() => {});
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      await ensureAudioRunning();
      if (isRunning) {
        await requestWakeLock();
      }
    }
  });

  // 初回ユーザー操作で確実にアンロック
  function handleFirstInteraction() {
    ensureAudioRunning();
    selectBestVoice();
    if ('speechSynthesis' in window) {
      const dummyUtter = new SpeechSynthesisUtterance('');
      dummyUtter.volume = 0;
      window.speechSynthesis.speak(dummyUtter);
    }
  }
  document.addEventListener('pointerdown', handleFirstInteraction, { once: true });

  // ====== 音声・ブザー再生ロジック ======

  // Chromium(Edge/Chrome)の cancel() 直後 speak() 無音バグ＆GC途中切断を回避
  function safeSpeak(text, forceInterrupt = false) {
    if (!('speechSynthesis' in window)) return;
    ensureAudioRunning();

    if (speakDelayTimer) {
      clearTimeout(speakDelayTimer);
      speakDelayTimer = null;
    }

    const doSpeak = () => {
      if (!selectedVoice) selectBestVoice();
      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) {
        utter.voice = selectedVoice;
        utter.lang = selectedVoice.lang;
      } else {
        utter.lang = 'en-US';
      }
      utter.rate = 1.2;
      utter.pitch = 1.05;
      utter.volume = 1.0;

      // GCによる発話途中切断を防ぐため参照を保持
      activeUtterances.push(utter);
      const cleanup = () => {
        const idx = activeUtterances.indexOf(utter);
        if (idx !== -1) activeUtterances.splice(idx, 1);
      };
      utter.onend = cleanup;
      utter.onerror = cleanup;

      try {
        window.speechSynthesis.speak(utter);
      } catch (e) {
        cleanup();
      }
    };

    // 発話中・待機中または強制割り込み時のみキャンセルし、60ms待ってから発話
    if (forceInterrupt || window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
      speakDelayTimer = setTimeout(doSpeak, 60);
    } else {
      doSpeak();
    }
  }

  function speakStart() {
    const text = (currentMode === 'rest') ? 'Water break' : 'Start';
    safeSpeak(text, true);
  }

  // 1分前の高く澄んだ短いベル音（チーン！）
  async function playBellSound() {
    await ensureAudioRunning();
    if (!audioCtx || !masterOut) return;
    const now = audioCtx.currentTime + 0.01;
    const duration = 1.1;

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.001, now);
    gainNode.gain.linearRampToValueAtTime(0.45, now + 0.008);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
    gainNode.connect(masterOut);

    const freqs = [4186.0, 5274.0, 6272.0, 8372.0];
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(gainNode);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    });
  }

  // 休憩の残り15秒はビビッ！を鳴らす
  async function playLowAlert() {
    await ensureAudioRunning();
    if (!audioCtx || !masterOut) return;
    const now = audioCtx.currentTime + 0.01;
    createSquareBeep(now, 0.20);
    createSquareBeep(now + 0.30, 0.20);
  }

  function createSquareBeep(startTime, duration) {
    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.001, startTime);
    gainNode.gain.linearRampToValueAtTime(0.45, startTime + 0.005);
    gainNode.gain.setValueAtTime(0.45, startTime + duration - 0.03);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    gainNode.connect(masterOut);

    const freqs = [220, 330, 440];
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(f, startTime);
      osc.connect(gainNode);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    });
  }

  // 終了時アリーナホーン（ブーッ！）
  async function playBuzzer() {
    if ('speechSynthesis' in window) {
      if (speakDelayTimer) {
        clearTimeout(speakDelayTimer);
        speakDelayTimer = null;
      }
      window.speechSynthesis.cancel();
    }
    await ensureAudioRunning();
    if (!audioCtx || !masterOut) return;

    const now = audioCtx.currentTime + 0.01;
    const duration = 1.5;

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.001, now);
    gainNode.gain.linearRampToValueAtTime(0.55, now + 0.01);
    gainNode.gain.setValueAtTime(0.55, now + duration - 0.1);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
    gainNode.connect(masterOut);

    const freqs = [420, 560, 840];
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(gainNode);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    });
  }

  function testBuzzer() {
    ensureAudioRunning();
    requestWakeLock();
    speakStart();
    setTimeout(() => {
      playBellSound();
      setTimeout(() => {
        safeSpeak("3");
        setTimeout(() => safeSpeak("2"), 900);
        setTimeout(() => safeSpeak("1"), 1800);
        setTimeout(() => playBuzzer(), 2700);
      }, 1200);
    }, 1100);
  }

  // ====== タイマー制御ロジック ======

  function toggleFullScreen() {
    ensureAudioRunning();
    requestWakeLock();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen();
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
      fsBtnEl.textContent = '✕ 解除';
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      fsBtnEl.textContent = '⛶ 全画面';
    }
  }

  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  function updateFsButton() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fsBtnEl.textContent = '✕ 解除';
    } else {
      fsBtnEl.textContent = '⛶ 全画面';
    }
  }

  function stopTimerLoop() {
    if (timerIntervalId !== null) {
      clearInterval(timerIntervalId);
      timerIntervalId = null;
    }
  }

  function setMode(mode, ms, btnId, labelText) {
    ensureAudioRunning();
    requestWakeLock();
    stopTimerLoop();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    isRunning = false;
    currentMode = mode;
    currentBtnId = btnId;
    currentLabelText = labelText;
    defaultDuration = ms;
    remainingMs = ms;
    targetEndTime = null;
    lastCountdownSec = -1;
    hasTriggeredOneMinAlert = (ms <= 60000);
    hasTriggeredRest15sAlert = (ms <= 15000);

    timerBoxEl.classList.remove('ended');
    statusBadgeEl.textContent = 'READY';
    statusBadgeEl.className = 'status-badge';
    tapHintEl.textContent = '画面タップで START';

    document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
    if (btnId) {
      document.getElementById(btnId).classList.add('active');
    }

    modeLabelEl.textContent = labelText;
    if (mode === 'game') {
      modeLabelEl.className = 'mode-label';
      displayEl.classList.remove('rest');
      displayBgEl.classList.remove('rest');
    } else {
      modeLabelEl.className = 'mode-label rest';
      displayEl.classList.add('rest');
      displayBgEl.classList.add('rest');
    }

    updateDisplay();
  }

  function renderDigits(str, isSubSec) {
    let html = '';
    let bgHtml = '';
    for (let char of str) {
      if (char === ':' || char === '.') {
        html += '<span class="slot-sep">' + char + '</span>';
        bgHtml += '<span class="slot-sep">' + char + '</span>';
      } else if (char === ' ') {
        html += '<span class="slot-num" style="visibility: hidden;">0</span>';
        bgHtml += '<span class="slot-num">8</span>';
      } else {
        html += '<span class="slot-num">' + char + '</span>';
        bgHtml += '<span class="slot-num">8</span>';
      }
    }
    displayEl.innerHTML = html;
    displayBgEl.innerHTML = bgHtml;
    
    if (currentMode === 'game' && isSubSec) {
      displayEl.classList.add('sub-second');
    } else {
      displayEl.classList.remove('sub-second');
    }
  }

  function updateDisplay() {
    if (remainingMs <= 0) {
      renderDigits(" 0.0", true);
      return;
    }
    
    if (remainingMs < 60000) {
      const totalSeconds = (remainingMs / 1000);
      let secStr = totalSeconds.toFixed(1);
      if (totalSeconds < 10) {
        secStr = " " + secStr;
      }
      renderDigits(secStr, true);
      return;
    }

    const totalSec = Math.ceil(remainingMs / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    const mStr = String(m).padStart(2, ' ');
    const sStr = String(s).padStart(2, '0');
    renderDigits(mStr + ':' + sStr, false);
  }

  function tick() {
    if (!isRunning) return;

    remainingMs = targetEndTime - Date.now();

    // GAMEモード: 残り1分到達時（超高音ベルのみ・音声干渉なし）
    if (currentMode === 'game' && remainingMs <= 60000 && !hasTriggeredOneMinAlert) {
      hasTriggeredOneMinAlert = true;
      playBellSound();
    }

    // 休憩モード: 残り15秒到達時（ブザー "ビビッ！"）
    if (currentMode === 'rest' && remainingMs <= 15000 && !hasTriggeredRest15sAlert) {
      hasTriggeredRest15sAlert = true;
      playLowAlert();
    }

    // 10秒〜1秒 カウントダウン（10.0秒→10, 9.0秒→9 ... 1.0秒→1）
    if (remainingMs > 0 && remainingMs <= 10050) {
      const currentSec = Math.ceil(remainingMs / 1000);
      if (currentSec !== lastCountdownSec && currentSec <= 10 && currentSec >= 1) {
        lastCountdownSec = currentSec;
        safeSpeak(String(currentSec), false);
      }
    } else {
      lastCountdownSec = -1;
    }

    if (remainingMs <= 0) {
      remainingMs = 0;
      isRunning = false;
      stopTimerLoop();
      lastCountdownSec = -1;
      updateDisplay();
      timerBoxEl.classList.add('ended');
      statusBadgeEl.textContent = 'TIME UP';
      statusBadgeEl.className = 'status-badge ended';
      tapHintEl.textContent = currentMode === 'game' ? '試合終了' : '休憩終了';
      playBuzzer();
      releaseWakeLock();
      return;
    }

    updateDisplay();
  }

  function toggleTimer() {
    ensureAudioRunning();
    requestWakeLock();
    if (remainingMs <= 0) {
      setMode(currentMode, defaultDuration, currentBtnId, currentLabelText);
      return;
    }

    isRunning = !isRunning;

    if (isRunning) {
      targetEndTime = Date.now() + remainingMs;
      stopTimerLoop();
      timerIntervalId = setInterval(tick, 50);
      statusBadgeEl.textContent = 'RUNNING';
      statusBadgeEl.className = 'status-badge running';
      tapHintEl.textContent = 'タップで PAUSE';
      timerBoxEl.classList.remove('ended');
      speakStart();
    } else {
      stopTimerLoop();
      remainingMs = Math.max(0, targetEndTime - Date.now());
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      statusBadgeEl.textContent = 'PAUSED';
      statusBadgeEl.className = 'status-badge paused';
      tapHintEl.textContent = 'タップで RESUME';
      releaseWakeLock();
      updateDisplay();
    }
  }

  function adjustTime(deltaMs) {
    ensureAudioRunning();
    requestWakeLock();
    if (isRunning) {
      remainingMs = Math.max(0, (targetEndTime - Date.now()) + deltaMs);
      targetEndTime = Date.now() + remainingMs;
    } else {
      remainingMs = Math.max(0, remainingMs + deltaMs);
    }
    lastCountdownSec = -1;
    if (remainingMs > 60000) {
      hasTriggeredOneMinAlert = false;
    }
    if (remainingMs > 15000) {
      hasTriggeredRest15sAlert = false;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    updateDisplay();
    if (remainingMs > 0 && timerBoxEl.classList.contains('ended')) {
      timerBoxEl.classList.remove('ended');
      statusBadgeEl.textContent = isRunning ? 'RUNNING' : 'PAUSED';
      statusBadgeEl.className = 'status-badge ' + (isRunning ? 'running' : 'paused');
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggleTimer();
    } else if (e.code === 'KeyG' || e.code === 'Digit5') {
      setMode('game', 5 * 60 * 1000, 'btnGame5', 'GAME (5:00)');
    } else if (e.code === 'Digit6') {
      setMode('game', 6 * 60 * 1000, 'btnGame6', 'GAME (6:00)');
    } else if (e.code === 'Digit7') {
      setMode('game', 7 * 60 * 1000, 'btnGame7', 'GAME (7:00)');
    } else if (e.code === 'Digit8') {
      setMode('game', 8 * 60 * 1000, 'btnGame8', 'GAME (8:00)');
    } else if (e.code === 'KeyR') {
      setMode('rest', 75 * 1000, 'btnRest', '休憩 (1:15)');
    }
  });

  ['pointerdown', 'click'].forEach(evt => {
    document.addEventListener(evt, function unlockAudio() {
      ensureAudioRunning();
      if (isRunning) requestWakeLock();
    }, { passive: true });
  });

  updateDisplay();
</script>
</body>
</html>
