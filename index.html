<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Basketball Game Timer</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/digital-7-mono');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* ヘッダーエリア */
  .header {
    height: 34px;
    flex-shrink: 0;
    background-color: #0d0d0d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    border-bottom: 2px solid #1f1f1f;
  }
  .header .title {
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #555;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .status-badge {
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    background-color: #222;
    color: #777;
  }
  .header .status-badge.running {
    background-color: #00e676;
    color: #000;
  }
  .header .status-badge.paused {
    background-color: #ff9100;
    color: #000;
  }
  .header .status-badge.ended {
    background-color: #ff1744;
    color: #fff;
    animation: flash 0.5s infinite alternate;
  }

  .btn-fs {
    background-color: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
  }

  @keyframes flash {
    from { opacity: 1; }
    to { opacity: 0.25; }
  }

  /* メインタイマー表示エリア */
  .timer-box {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: radial-gradient(circle, #151515 0%, #000000 100%);
    position: relative;
    border: 4px solid transparent;
    overflow: hidden;
  }
  .timer-box.ended {
    border-color: #ff1744;
    background: #250005;
  }
  
  .mode-label {
    position: absolute;
    top: 6px;
    left: 12px;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 2px 10px;
    border-radius: 6px;
    background-color: #141414;
    color: #ffd600;
    border: 1px solid #282828;
    z-index: 10;
  }
  .mode-label.rest {
    color: #76ff03;
    border-color: #43a047;
  }

  /* 特大 Digital-7 タイマー表示レイヤー */
  .digits-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  /* 消灯セグメント（背景ガイド 88:88 / 88.8） */
  .digits-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Digital-7 Mono', 'Digital-7', monospace;
    font-size: min(35vw, 62vh);
    color: rgba(255, 214, 0, 0.05);
    line-height: 0.82;
    transform: scaleY(1.35);
    transform-origin: center center;
    pointer-events: none;
    white-space: nowrap;
  }
  .digits-bg.rest {
    color: rgba(118, 255, 3, 0.06);
  }

  /* 点灯セグメント */
  .digits-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Digital-7 Mono', 'Digital-7', monospace;
    font-size: min(35vw, 62vh);
    font-weight: bold;
    color: #ffd600;
    text-shadow: 0 0 35px rgba(255, 214, 0, 0.6), 0 0 70px rgba(255, 214, 0, 0.3);
    line-height: 0.82;
    transform: scaleY(1.35);
    transform-origin: center center;
    white-space: nowrap;
    z-index: 2;
  }
  /* 休憩モード: 鮮やかなライムグリーン（最後まで維持） */
  .digits-container.rest {
    color: #76ff03 !important;
    text-shadow: 0 0 35px rgba(118, 255, 3, 0.7), 0 0 70px rgba(118, 255, 3, 0.35) !important;
  }
  /* GAMEモードの1分未満: オレンジレッド */
  .digits-container.sub-second {
    color: #ff3d00;
    text-shadow: 0 0 35px rgba(255, 61, 0, 0.7), 0 0 70px rgba(255, 61, 0, 0.35);
  }

  .slot-num {
    display: inline-block;
    width: 0.56em;
    text-align: center;
  }
  .slot-sep {
    display: inline-block;
    width: 0.30em;
    text-align: center;
  }

  .tap-hint {
    position: absolute;
    bottom: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    color: #383838;
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 10;
  }

  /* コントロールパネル */
  .controls {
    height: 68px;
    flex-shrink: 0;
    background-color: #0a0a0a;
    display: grid;
    grid-template-columns: 1.2fr 1.2fr 1fr 1fr 1fr 1fr 0.9fr;
    gap: 5px;
    padding: 6px 8px;
    border-top: 2px solid #1a1a1a;
  }
  .btn {
    background-color: #1e1e1e;
    color: #f0f0f0;
    border: none;
    border-radius: 8px;
    font-size: clamp(0.78rem, 1.5vw, 1.05rem);
    font-weight: 800;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
  }
  .btn:active {
    transform: scale(0.96);
    background-color: #333;
  }
  .btn-mode {
    border: 2px solid transparent;
  }
  .btn-game {
    background-color: #b71c1c;
    color: #fff;
  }
  .btn-game.active {
    border-color: #ffd600;
    box-shadow: 0 0 10px rgba(255, 214, 0, 0.4);
  }
  .btn-rest {
    background-color: #1b5e20;
    color: #fff;
  }
  .btn-rest.active {
    border-color: #76ff03;
    box-shadow: 0 0 10px rgba(118, 255, 3, 0.4);
  }
  .btn-action {
    background-color: #0d47a1;
    color: #fff;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="title">BASKETBALL TIMER</div>
    <div class="header-right">
      <button class="btn-fs" onclick="toggleFullScreen()" id="fsBtn">⛶ 全画面</button>
      <div id="statusBadge" class="status-badge">READY</div>
    </div>
  </div>

  <div class="timer-box" id="timerBox" onclick="toggleTimer()">
    <div class="mode-label" id="modeLabel">GAME (5:00)</div>
    <div class="digits-wrapper">
      <div class="digits-bg" id="displayBg">
        <span class="slot-num">8</span>
        <span class="slot-num">8</span>
        <span class="slot-sep">:</span>
        <span class="slot-num">8</span>
        <span class="slot-num">8</span>
      </div>
      <div class="digits-container" id="display">
        <span class="slot-num" style="visibility: hidden;">0</span>
        <span class="slot-num">5</span>
        <span class="slot-sep">:</span>
        <span class="slot-num">0</span>
        <span class="slot-num">0</span>
      </div>
    </div>
    <div class="tap-hint" id="tapHint">画面タップで START / STOP</div>
  </div>

  <div class="controls">
    <button class="btn btn-mode btn-game active" id="btnGame" onclick="setMode('game', 5 * 60 * 1000)">GAME<br>(5分)</button>
    <button class="btn btn-mode btn-rest" id="btnRest" onclick="setMode('rest', 75 * 1000)">休憩<br>(1:15)</button>
    <button class="btn" onclick="adjustTime(60000)">+1 分</button>
    <button class="btn" onclick="adjustTime(-60000)">-1 分</button>
    <button class="btn" onclick="adjustTime(10000)">+10 秒</button>
    <button class="btn" onclick="adjustTime(-10000)">-10 秒</button>
    <button class="btn btn-action" onclick="testBuzzer()">📢 試聴</button>
  </div>

<script>
  let currentMode = 'game';
  let defaultDuration = 5 * 60 * 1000;
  let remainingMs = defaultDuration;
  let isRunning = false;
  let lastTimestamp = null;
  let animationFrameId = null;
  let lastCountdownSec = -1;
  let hasTriggeredOneMinAlert = false;
  let hasTriggeredRest15sAlert = false;
  let wakeLock = null;

  // Web Audio API 用のコンテキスト
  let audioCtx = null;

  const displayEl = document.getElementById('display');
  const displayBgEl = document.getElementById('displayBg');
  const timerBoxEl = document.getElementById('timerBox');
  const statusBadgeEl = document.getElementById('statusBadge');
  const tapHintEl = document.getElementById('tapHint');
  const modeLabelEl = document.getElementById('modeLabel');
  const btnGameEl = document.getElementById('btnGame');
  const btnRestEl = document.getElementById('btnRest');
  const fsBtnEl = document.getElementById('fsBtn');

  // モバイル端末でのオーディオ＆音声合成エンジンのロック解除
  function initAudioEngine() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    if ('speechSynthesis' in window) {
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }
  }

  // ==== スリープ防止 (Screen Wake Lock API) ====
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('Wake Lock is active');
        
        wakeLock.addEventListener('release', () => {
          console.log('Wake Lock was released');
        });
      }
    } catch (err) {
      console.error(`${err.name}, ${err.message}`);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => {
        wakeLock = null;
        console.log('Wake Lock released manually');
      });
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
      await requestWakeLock();
    }
  });


  // 画面初回のタッチで発火させて制限を確実に解除
  document.addEventListener('touchstart', function unlockFirst() {
    initAudioEngine();
    requestWakeLock();
    if ('speechSynthesis' in window) {
      const dummyUtter = new SpeechSynthesisUtterance('');
      dummyUtter.volume = 0;
      window.speechSynthesis.speak(dummyUtter);
    }
    document.removeEventListener('touchstart', unlockFirst);
  }, { once: true });


  // ====== 音声・ブザー再生ロジック ======

  function safeSpeak(text) {
    if (!('speechSynthesis' in window)) return;
    initAudioEngine();
    window.speechSynthesis.cancel(); 

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    // 周囲の音に負けないよう、少し高め・早めに設定
    utter.rate = 1.25;
    utter.pitch = 1.05;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function speakStart() {
    const text = (currentMode === 'rest') ? 'Water break' : 'Start';
    safeSpeak(text);
  }

  // 1分前の短いベル音（澄んだチーン！という音）
  function playBellSound() {
    initAudioEngine();
    const now = audioCtx.currentTime;
    const duration = 0.8; // 余韻を含む長さ

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1.0, now);
    // 指数的に減衰させてベルの響きを作る
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
    gainNode.connect(audioCtx.destination);

    // ベルらしい金属的な和音（サイン波）
    const freqs = [1046.5, 1318.5, 1567.9]; // C6, E6, G6
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(gainNode);
      osc.start(now);
      osc.stop(now + duration);
    });
  }

  // 休憩の残り15秒はビビッ！を鳴らす
  function playLowAlert() {
    initAudioEngine();
    const now = audioCtx.currentTime;
    
    // 0.2秒鳴る -> 0.1秒休む -> 0.2秒鳴る
    createSquareBeep(now, 0.20);
    createSquareBeep(now + 0.30, 0.20);
  }

  function createSquareBeep(startTime, duration) {
    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1.0, startTime);
    gainNode.gain.setValueAtTime(1.0, startTime + duration - 0.05);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    gainNode.connect(audioCtx.destination);

    const freqs = [220, 330, 440];
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(f, startTime);
      osc.connect(gainNode);
      osc.start(startTime);
      osc.stop(startTime + duration);
    });
  }

  // アリーナホーン
  function playBuzzer() {
    initAudioEngine();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    const now = audioCtx.currentTime;
    const duration = 1.5;

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1.0, now);
    gainNode.gain.setValueAtTime(1.0, now + duration - 0.1);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
    gainNode.connect(audioCtx.destination);

    const freqs = [420, 560, 840];
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(gainNode);
      osc.start(now);
      osc.stop(now + duration);
    });
  }

  function testBuzzer() {
    initAudioEngine();
    requestWakeLock();
    speakStart();
    setTimeout(() => {
      playBellSound();
      setTimeout(() => {
        safeSpeak("3");
        setTimeout(() => safeSpeak("2"), 650);
        setTimeout(() => safeSpeak("1"), 1300);
        setTimeout(() => playBuzzer(), 1950);
      }, 1000);
    }, 1100);
  }

  // ====== タイマー制御ロジック ======

  function toggleFullScreen() {
    initAudioEngine();
    requestWakeLock();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen();
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
      fsBtnEl.textContent = '✕ 解除';
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      fsBtnEl.textContent = '⛶ 全画面';
    }
  }

  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  function updateFsButton() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      fsBtnEl.textContent = '✕ 解除';
    } else {
      fsBtnEl.textContent = '⛶ 全画面';
    }
  }

  function setMode(mode, ms) {
    initAudioEngine();
    requestWakeLock();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    isRunning = false;
    currentMode = mode;
    defaultDuration = ms;
    remainingMs = ms;
    lastTimestamp = null;
    lastCountdownSec = -1;
    hasTriggeredOneMinAlert = (ms < 60000);
    hasTriggeredRest15sAlert = (ms < 15000);

    timerBoxEl.classList.remove('ended');
    statusBadgeEl.textContent = 'READY';
    statusBadgeEl.className = 'status-badge';
    tapHintEl.textContent = '画面タップで START';

    if (mode === 'game') {
      btnGameEl.classList.add('active');
      btnRestEl.classList.remove('active');
      modeLabelEl.textContent = 'GAME (5:00)';
      modeLabelEl.className = 'mode-label';
      displayEl.classList.remove('rest');
      displayBgEl.classList.remove('rest');
    } else {
      btnRestEl.classList.add('active');
      btnGameEl.classList.remove('active');
      modeLabelEl.textContent = '休憩 (1:15)';
      modeLabelEl.className = 'mode-label rest';
      displayEl.classList.add('rest');
      displayBgEl.classList.add('rest');
    }

    updateDisplay();
  }

  function renderDigits(str, isSubSec) {
    let html = '';
    let bgHtml = '';
    for (let char of str) {
      if (char === ':' || char === '.') {
        html += '<span class="slot-sep">' + char + '</span>';
        bgHtml += '<span class="slot-sep">' + char + '</span>';
      } else if (char === ' ') {
        html += '<span class="slot-num" style="visibility: hidden;">0</span>';
        bgHtml += '<span class="slot-num">8</span>';
      } else {
        html += '<span class="slot-num">' + char + '</span>';
        bgHtml += '<span class="slot-num">8</span>';
      }
    }
    displayEl.innerHTML = html;
    displayBgEl.innerHTML = bgHtml;
    
    if (currentMode === 'game' && isSubSec) {
      displayEl.classList.add('sub-second');
    } else {
      displayEl.classList.remove('sub-second');
    }
  }

  function updateDisplay() {
    if (remainingMs <= 0) {
      renderDigits(" 0.0", true); 
      return;
    }
    
    if (remainingMs < 60000) {
      const totalSeconds = (remainingMs / 1000);
      let secStr = totalSeconds.toFixed(1);
      if (totalSeconds < 10) {
        secStr = " " + secStr;
      }
      renderDigits(secStr, true);
      return;
    }

    const totalSec = Math.ceil(remainingMs / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    const mStr = String(m).padStart(2, ' ');
    const sStr = String(s).padStart(2, '0');
    renderDigits(mStr + ':' + sStr, false);
  }

  function tick(currentTimestamp) {
    if (!isRunning) return;

    if (!lastTimestamp) {
      lastTimestamp = currentTimestamp;
    }

    const elapsed = currentTimestamp - lastTimestamp;
    lastTimestamp = currentTimestamp;

    remainingMs -= elapsed;

    // GAMEモード: 残り1分到達時（短いベル音）
    if (currentMode === 'game' && remainingMs <= 60000 && !hasTriggeredOneMinAlert) {
      hasTriggeredOneMinAlert = true;
      playBellSound();
    }

    // 休憩モード: 残り15秒到達時（ブザー "ビビッ！"）
    if (currentMode === 'rest' && remainingMs <= 15000 && !hasTriggeredRest15sAlert) {
      hasTriggeredRest15sAlert = true;
      playLowAlert();
    }

    // 10秒〜1秒 英語カウントダウン
    if (remainingMs > 0 && remainingMs <= 10000) {
      const currentSec = Math.floor(remainingMs / 1000) + 1;
      if (currentSec !== lastCountdownSec && currentSec <= 10 && currentSec >= 1) {
        lastCountdownSec = currentSec;
        safeSpeak(String(currentSec));
      }
    } else {
      lastCountdownSec = -1;
    }

    if (remainingMs <= 0) {
      remainingMs = 0;
      isRunning = false;
      lastCountdownSec = -1;
      updateDisplay();
      timerBoxEl.classList.add('ended');
      statusBadgeEl.textContent = 'TIME UP';
      statusBadgeEl.className = 'status-badge ended';
      tapHintEl.textContent = currentMode === 'game' ? '試合終了' : '休憩終了';
      playBuzzer();
      releaseWakeLock();
      return;
    }

    updateDisplay();
    animationFrameId = requestAnimationFrame(tick);
  }

  function toggleTimer() {
    initAudioEngine();
    requestWakeLock();
    if (remainingMs <= 0) {
      setMode(currentMode, defaultDuration);
      return;
    }

    isRunning = !isRunning;

    if (isRunning) {
      lastTimestamp = performance.now();
      animationFrameId = requestAnimationFrame(tick);
      statusBadgeEl.textContent = 'RUNNING';
      statusBadgeEl.className = 'status-badge running';
      tapHintEl.textContent = 'タップで PAUSE';
      timerBoxEl.classList.remove('ended');
      speakStart();
    } else {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      statusBadgeEl.textContent = 'PAUSED';
      statusBadgeEl.className = 'status-badge paused';
      tapHintEl.textContent = 'タップで RESUME';
      releaseWakeLock();
    }
  }

  function adjustTime(deltaMs) {
    initAudioEngine();
    requestWakeLock();
    remainingMs = Math.max(0, remainingMs + deltaMs);
    lastCountdownSec = -1;
    if (remainingMs > 60000) {
      hasTriggeredOneMinAlert = false;
    }
    if (remainingMs > 15000) {
      hasTriggeredRest15sAlert = false;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    updateDisplay();
    if (remainingMs > 0 && timerBoxEl.classList.contains('ended')) {
      timerBoxEl.classList.remove('ended');
      statusBadgeEl.textContent = isRunning ? 'RUNNING' : 'PAUSED';
      statusBadgeEl.className = 'status-badge ' + (isRunning ? 'running' : 'paused');
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggleTimer();
    } else if (e.code === 'KeyG') {
      setMode('game', 5 * 60 * 1000);
    } else if (e.code === 'KeyR') {
      setMode('rest', 75 * 1000);
    }
  });

  ['touchstart', 'click'].forEach(evt => {
    document.addEventListener(evt, function unlockAudio() {
      initAudioEngine();
      if(isRunning) requestWakeLock();
    }, { passive: true });
  });

  updateDisplay();
</script>
</body>
</html>
